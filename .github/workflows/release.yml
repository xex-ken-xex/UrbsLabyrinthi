name: Release

# main にマージ(push)されるたびに、Deploy/ の最新のビルドから、起動時の自動更新が使う .pck と latest.json を作り、
# GitHub の Release「test」(テスト用。配布用ではない)を上書きする。ほかの Release は消す(リポジトリの README のとおり、リリースはしない)。
# ZIP とインストーラーは、Release には載せず、この実行の成果物(Artifacts、90日)に置く。
# ビルド自体は tools/build-deploy.sh で行い、Deploy/ にコミットしておく決まり(CI では、それをまとめるだけ)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: NSIS を入れる(Windows のインストーラー用)
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis

      - name: ZIP とインストーラー、自動更新用の .pck にまとめる
        env:
          INSTALLER_VERSION: v${{ github.run_number }}
          RELEASE_TAG: test
        run: tools/package-release.sh dist

      - name: ZIP とインストーラーを成果物に置く(テストの機械に入れ直すとき用)
        uses: actions/upload-artifact@v4
        with:
          name: UrbsLabyrinthi-v${{ github.run_number }}
          path: |
            dist/UrbsLabyrinthi-setup.exe
            dist/UrbsLabyrinthi-windows.zip
            dist/UrbsLabyrinthi-linux.zip
          retention-days: 90

      - name: Release「test」を上書きし、ほかの Release を消す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="v${{ github.run_number }}"
          SHORT="$(git rev-parse --short HEAD)"
          {
            echo "テスト用(配布用ではない)。起動時の自動更新が使う、ゲームの中身(.pck)と latest.json だけを置く。"
            echo
            echo "版 $VER、main の $SHORT。"
            echo
            echo '```'
            cat Deploy/VERSION
            echo '```'
          } > notes.md
          (cd dist && sha256sum UrbsLabyrinthi-windows.pck UrbsLabyrinthi-linux.pck latest.json > SHA256SUMS.txt)
          gh release delete test --cleanup-tag --yes || true
          gh release create test dist/UrbsLabyrinthi-windows.pck dist/UrbsLabyrinthi-linux.pck dist/latest.json dist/SHA256SUMS.txt \
            --title "test — テスト用($VER)" --notes-file notes.md --target "${{ github.sha }}" --latest
          # 自動更新は releases/latest を見るので、test に「最新」の印を付けたまま、ほかの Release とタグを消す
          gh release list --limit 300 --json tagName --jq '.[].tagName' | { grep -vx test || true; } | while read -r t; do
            gh release delete "$t" --cleanup-tag --yes
          done
