name: Release

# main にマージ(push)されるたびに、Deploy/ の最新のビルドから、起動時の自動更新が使う .pck と latest.json を作り、
# GitHub の Release「test」を上書きする。ほかの Release は消す(Release は「test」の一つだけ)。
# Release「test」には、遊ぶための一式(Windows のインストーラーと ZIP、Linux の ZIP)も載せる。
# 紹介ページ(site/)のダウンロードは releases/latest/download/<名前> を指すので、ファイル名を変えるときは site/index.html も直す。
# ビルド自体は tools/build-deploy.sh で行い、Deploy/ にコミットしておく決まり(CI では、それをまとめるだけ)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: NSIS を入れる(Windows のインストーラー用)
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis

      - name: ZIP とインストーラー、自動更新用の .pck にまとめる
        env:
          INSTALLER_VERSION: v${{ github.run_number }}
          RELEASE_TAG: test
        run: tools/package-release.sh dist

      - name: Release「test」を上書きし、ほかの Release を消す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="v${{ github.run_number }}"
          SHORT="$(git rev-parse --short HEAD)"
          {
            echo "実験中の版です。動作や内容について、保証やサポートはありません。"
            echo
            echo "- **UrbsLabyrinthi-setup.exe** Windows のインストーラー(自分のユーザーにだけ入れる。管理者の権限は要らない)"
            echo "- **UrbsLabyrinthi-windows.zip** Windows 用。展開して UrbsLabyrinthi.exe を起動する"
            echo "- **UrbsLabyrinthi-linux.zip** Linux 用。展開して UrbsLabyrinthi.x86_64 を起動する"
            echo
            echo "一度入れれば、起動したときに新しい版のゲームの中身(.pck)を取ってきて入れ替える。.pck と latest.json はそのためのもの。"
            echo
            echo "版 $VER、main の $SHORT。"
            echo
            echo '```'
            cat Deploy/VERSION
            echo '```'
          } > notes.md
          FILES="UrbsLabyrinthi-setup.exe UrbsLabyrinthi-windows.zip UrbsLabyrinthi-linux.zip UrbsLabyrinthi-windows.pck UrbsLabyrinthi-linux.pck latest.json"
          (cd dist && sha256sum $FILES > SHA256SUMS.txt)
          gh release delete test --cleanup-tag --yes || true
          gh release create test $(for f in $FILES SHA256SUMS.txt; do echo "dist/$f"; done) \
            --title "Urbs Labyrinthi $VER" --notes-file notes.md --target "${{ github.sha }}" --latest
          # 自動更新は releases/latest を見るので、test に「最新」の印を付けたまま、ほかの Release とタグを消す
          gh release list --limit 300 --json tagName --jq '.[].tagName' | { grep -vx test || true; } | while read -r t; do
            gh release delete "$t" --cleanup-tag --yes
          done
