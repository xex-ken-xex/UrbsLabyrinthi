<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>座環盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{
  --bg:#DCE4DF; --panel:#E9EFEB; --ink:#12302E; --mute:#4D6764; --line:#B3C5BE;
  --bronze:#9A6428; --bronze-d:#6E4415; --teal:#2A625C; --focus:#1F6B78;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101D1C;--panel:#172928;--ink:#DCE9E4;--mute:#8FAAA5;--line:#2B4441;--bronze:#D49A52;--bronze-d:#E3B476;--teal:#6DB8AB;--focus:#8CD0DA}
}
:root[data-theme="dark"]{--bg:#101D1C;--panel:#172928;--ink:#DCE9E4;--mute:#8FAAA5;--line:#2B4441;--bronze:#D49A52;--bronze-d:#E3B476;--teal:#6DB8AB;--focus:#8CD0DA}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.75 "Zen Kaku Gothic New","Yu Gothic","Hiragino Sans",sans-serif}
.serif,h1,h2{font-family:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 48px}
header h1{margin:0;font-size:clamp(26px,4vw,36px);letter-spacing:.12em;font-weight:700}
header p{margin:6px 0 0;color:var(--mute);max-width:36em}
.layout{display:grid;grid-template-columns:minmax(300px,560px) minmax(280px,1fr);gap:32px;align-items:start;margin-top:22px}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.dialbox{outline:none;border-radius:50%}
.dialbox:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
svg{display:block;width:100%;height:auto}
.ring{transform-box:view-box;transform-origin:300px 300px;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.ring{transition:none}}
.rt{font-family:"Shippori Mincho","Yu Mincho",serif;font-weight:700;text-anchor:middle;dominant-baseline:central}
h2{font-size:17px;margin:0 0 8px;font-weight:700;letter-spacing:.04em}
.block{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0;margin-bottom:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
label{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
input[type=number],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 8px}
input[type=number]{width:5.4em;text-align:center}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.steps{display:grid;grid-template-columns:auto auto auto;gap:6px 8px;margin-top:12px;justify-content:start;align-items:center}
.steps .nm{color:var(--mute);font-size:14px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 14px;cursor:pointer;min-height:32px}
button:hover{border-color:var(--bronze)}
button.main{background:var(--bronze);border-color:var(--bronze);color:#fff;font-weight:700}
button.main:hover{background:var(--bronze-d)}
dl{margin:0;display:grid;grid-template-columns:5.6em 1fr;gap:6px 14px}
dt{color:var(--mute)}
dd{margin:0}
.big{font:700 19px/1.5 "Shippori Mincho","Yu Mincho",serif}
.tag{display:inline-block;border:1px solid var(--bronze);color:var(--bronze-d);padding:0 10px;margin:0 6px 4px 0;border-radius:2px;font-size:13px}
.note{color:var(--mute);font-size:13px;margin:8px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>座環盤</h1>
    <p>星録の暦官が使う、手回しの計算盤。座暦の日付を合わせると、月・夜・節が読めます。</p>
  </header>

  <div class="layout">
    <div>
      <div class="dialbox" id="dialbox" tabindex="0" aria-label="座環盤。左右の矢印で一夜、上下の矢印で一巡り進めたり戻したりできます">
        <svg id="dial" viewBox="0 0 600 600" role="img" aria-label="座環盤"></svg>
      </div>
      <p class="note">外から、月・夜・節・数え輪。上の指標に重なった目盛りを読みます。</p>
    </div>

    <div>
      <section class="block" aria-label="日付を合わせる">
        <h2>日付を合わせる</h2>
        <div class="row">
          <label>座暦 <input id="fy" type="number" min="1" max="9999" inputmode="numeric"> 年</label>
          <label><select id="fm" aria-label="月"></select></label>
          <label><input id="fd" type="number" min="1" max="79" inputmode="numeric" aria-label="夜"> 夜</label>
        </div>
        <div class="steps" id="steps"></div>
      </section>

      <section class="block" aria-live="polite" aria-label="読み取り">
        <h2>読み取り</h2>
        <p class="big" id="rdate"></p>
        <dl>
          <dt>節</dt><dd id="rsetsu"></dd>
          <dt>今年</dt><dd id="ryear"></dd>
          <dt>この月</dt><dd id="rmonth"></dd>
          <dt id="rtagk" hidden>行事</dt><dd id="rtag" hidden></dd>
        </dl>
      </section>

      <section class="block" aria-label="夜を数える">
        <h2>夜を数える</h2>
        <p class="note" style="margin:0 0 10px">誕生や弔いの七七夜を数えるときは、起点を決めて、数え輪を読みます。</p>
        <div class="row"><button class="main" id="setorigin" type="button">いまを起点にする</button></div>
        <dl style="margin-top:12px">
          <dt>起点</dt><dd id="oorigin"></dd>
          <dt>経過</dt><dd id="oelapsed"></dd>
          <dt>一巡り後</dt><dd id="o7"></dd>
          <dt>七七夜後</dt><dd id="o49"></dd>
        </dl>
      </section>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const SEATS=['天秩の王','大地の母','炉火の神','潮路の神','誓剣の神','星録の女神','癒しの神','荒野の狩人','灯火の女神','賽の神','静寂の母','空座'];
const SHORT=['天秩','大地','炉火','潮路','誓剣','星録','癒し','狩人','灯火','賽','静寂','空座'];
const KAN1=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
const KD=['','一','二','三','四','五','六','七','八','九'];
const MONTHTXT=['新年。法と誓約を更新する','種まきの月。産婆の月','炉開き（初日）。徒弟が職人になる','航海と市の始まり','婚礼と誓いの月','暦官の告示、書院の公開','暑さの病に備える','狩猟と隊商の最盛期','灯祭。色街と酒場に灯りがともる','年の市、賭場の祭り','夜が長い月。弔いの月','守護する神がいない月。願い事をしない'];
const WATARI=['','座降ろし','母の三夜','母の三夜','母の三夜','座昇り'];
const kan=n=>{const t=Math.floor(n/10),o=n%10;return (t>1?KD[t]:'')+(t>0?'十':'')+KD[o]};
const mod=(a,m)=>((a%m)+m)%m;

/* 暦の基本 */
const BASE=365,EXT=49,BIG=196,ANCHOR=859063,MAXY=9999;
const isBig=Y=>Y%BIG===0;
const startN=Y=>BASE*(Y-1)+EXT*Math.floor((Y-1)/BIG);
const MAXN=startN(MAXY+1)-1;
const yearOf=N=>{let Y=Math.floor(N/365.25)+1;while(startN(Y)>N)Y--;while(startN(Y+1)<=N)Y++;return Y};
const len12=Y=>isBig(Y)?30+EXT:30;
function parts(Y,i){
  if(i<330)return{kind:'m',month:Math.floor(i/30)+1,day:i%30+1};
  const l=len12(Y);
  if(i<330+l){const day=i-329;return{kind:'m',month:12,day,ext:day>30?day-30:0}}
  return{kind:'w',z:i-330-l+1};
}
const lenOf=(Y,m)=>m<=11?30:m===12?len12(Y):5;
function indexOf(Y,m,d){d=Math.max(1,Math.min(lenOf(Y,m),d));return m<=11?(m-1)*30+d-1:m===12?330+d-1:330+len12(Y)+d-1}
const seatOfBig=Y=>((Y/BIG-1)%12+12)%12;
const nextBig=Y=>Math.ceil(Y/BIG)*BIG;

/* 状態 */
let N=startN(2352);
let origin=N;
const sel=()=>{const Y=yearOf(N),P=parts(Y,N-startN(Y));return{Y,P,m:P.kind==='w'?13:P.month,d:P.kind==='w'?P.z:P.day}};
const setN=x=>{N=Math.max(0,Math.min(MAXN,x));render()};
const setSel=(Y,m,d)=>{Y=Math.max(1,Math.min(MAXY,Y));setN(startN(Y)+indexOf(Y,m,d))};
const stepYear=k=>{const s=sel();setSel(s.Y+k,s.m,s.d)};
const stepMonth=k=>{const s=sel();let Y=s.Y,m=s.m+k;if(m>13){Y++;m=1}else if(m<1){Y--;m=13}setSel(Y,m,s.d)};

/* 文字列 */
const monthName=m=>`${KAN1[m-1]}月（${SEATS[m-1]}の月）`;
function dateStr(Y,P){
  const y=`座暦${Y}年`;
  if(P.kind==='w')return `${y} 座渡し 第${KD[P.z]}夜`;
  return `${y} ${monthName(P.month)} ${kan(P.day)}夜`;
}
const dateOf=n=>{const Y=yearOf(n);return dateStr(Y,parts(Y,n-startN(Y)))};

/* 盤の描画 */
const CX=300,CY=300;
const polar=(r,deg)=>{const a=(deg-90)*Math.PI/180;return[CX+r*Math.cos(a),CY+r*Math.sin(a)]};
const f=v=>Math.round(v*100)/100;
function sector(r1,r2,a1,a2){
  const p1=polar(r2,a1),p2=polar(r2,a2),p3=polar(r1,a2),p4=polar(r1,a1);
  return `M${f(p1[0])} ${f(p1[1])}A${r2} ${r2} 0 0 1 ${f(p2[0])} ${f(p2[1])}L${f(p3[0])} ${f(p3[1])}A${r1} ${r1} 0 0 0 ${f(p4[0])} ${f(p4[1])}Z`;
}
const LIGHT='#EAF2EE',DARK='#0F2422';
const RINGS=[
  {id:'rm',r1:225,r2:285,n:12,fill:i=>i%2?'#2A625C':'#1F4E4A',txt:LIGHT,size:19,label:i=>SHORT[i]},
  {id:'rd',r1:181,r2:221,n:30,fill:i=>i%2?'#A6C9BF':'#8DB8AD',txt:DARK,size:13,label:i=>String(i+1)},
  {id:'rs',r1:135,r2:177,n:7,fill:i=>i%2?'#4B8A81':'#3E7C74',txt:LIGHT,size:16,label:i=>'第'+KD[i+1]+'節'},
  {id:'ro',r1:89,r2:131,n:49,fill:i=>i%2?'#DCE9E3':'#C9DDD5',txt:DARK,size:12,label:i=>i%7===0?(i===0?'起点':KD[i/7]+'巡'):''}
];
(function build(){
  let s='';
  RINGS.forEach(R=>{
    s+=`<g class="ring" id="${R.id}">`;
    for(let i=0;i<R.n;i++){
      const a=i*360/R.n,h=180/R.n;
      s+=`<path d="${sector(R.r1,R.r2,a-h,a+h)}" fill="${R.fill(i)}" stroke="${DARK}" stroke-opacity=".28" stroke-width=".7"/>`;
      const lb=R.label(i);
      if(lb)s+=`<text class="rt" transform="rotate(${f(a)} ${CX} ${CY})" x="${CX}" y="${f(CY-(R.r1+R.r2)/2)}" font-size="${R.size}" fill="${R.txt}">${lb}</text>`;
    }
    s+='</g>';
  });
  s+=`<circle cx="${CX}" cy="${CY}" r="288" fill="none" stroke="#9A6428" stroke-width="6"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="291.5" fill="none" stroke="#12302E" stroke-opacity=".35" stroke-width="1"/>`;
  s+=`<path d="${sector(89,285,-4.2,4.2)}" fill="#fff" fill-opacity=".2" stroke="#9A6428" stroke-width="1.6"/>`;
  s+=`<path d="M${CX-11} 3 L${CX+11} 3 L${CX} 30 Z" fill="#9A6428" stroke="#6E4415" stroke-width="1.5"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="85" fill="#12302E" stroke="#9A6428" stroke-width="3"/>`;
  s+=`<text class="rt" id="c1" x="${CX}" y="${CY-34}" font-size="14" fill="#9FC3BA"></text>`;
  s+=`<text class="rt" id="c2" x="${CX}" y="${CY-2}" font-size="32" fill="#EAF2EE"></text>`;
  s+=`<text class="rt" id="c3" x="${CX}" y="${CY+36}" font-size="19" fill="#E3B476"></text>`;
  $('#dial').innerHTML=s;
})();
const ang={};
function setRing(id,target){
  const el=document.getElementById(id);
  const cur=ang[id]===undefined?target:ang[id];
  const d=mod(target-cur+180,360)-180;
  ang[id]=cur+d;
  el.style.transform=`rotate(${ang[id]}deg)`;
}

/* 表示 */
function render(){
  const{Y,P,m,d}=sel();
  const s=mod(N-ANCHOR,7);
  setRing('rm',-(P.kind==='w'?11:P.month-1)*30);
  setRing('rd',-(P.kind==='w'?P.z-1:(P.day-1)%30)*12);
  setRing('rs',-s*360/7);
  setRing('ro',-mod(N-origin,49)*360/49);

  $('#c1').textContent=`座暦${Y}年`;
  $('#c2').textContent=P.kind==='w'?'座渡し':`${KAN1[P.month-1]}月`;
  $('#c3').textContent=P.kind==='w'?WATARI[P.z]:`${kan(P.day)}夜`;
  $('#dial').setAttribute('aria-label',`座環盤。${dateStr(Y,P)}、第${KD[s+1]}節の夜`);

  $('#rdate').textContent=dateStr(Y,P);
  $('#rsetsu').textContent=`第${KD[s+1]}節の夜`;

  let yt;
  if(isBig(Y)){const k=seatOfBig(Y);yt=`大閏の年。第${KAN1[k]}の大閏、${SEATS[k]}の番。空座の月は79夜まで続く`}
  else{const nb=nextBig(Y),k=seatOfBig(nb);yt=`平年。次の大閏は座暦${nb}年（あと${nb-Y}年）、第${KAN1[k]}座（${SEATS[k]}）の番`}
  $('#ryear').textContent=yt;

  $('#rmonth').textContent=P.kind==='w'
    ?'月に属さない五夜。神々が座を降り、座を替わる'
    :`${SEATS[P.month-1]}の月。${MONTHTXT[P.month-1]}`;

  const tags=[];
  if(P.kind==='w'){
    if(P.z===1)tags.push('座降ろしの夜（ヴェルガ・ノクスでは沈黙の夜）');
    else if(P.z<5)tags.push('母の三夜（静寂の母が世界を預かる）');
    else tags.push('座昇り（新しい年の前夜）');
  }else{
    if(P.month===3&&P.day===1)tags.push('炉開き');
    if(P.month===9)tags.push('灯祭の月');
    if(P.month===12&&P.ext)tags.push(`空座の七七夜 ${P.ext}夜目`);
  }
  const has=tags.length>0;
  $('#rtagk').hidden=!has;$('#rtag').hidden=!has;
  $('#rtag').innerHTML=tags.map(t=>`<span class="tag">${t}</span>`).join('');

  $('#fy').value=Y;
  const fm=$('#fm');if(+fm.value!==m)fm.value=m;
  const fd=$('#fd');fd.max=lenOf(Y,m);fd.value=d;

  const e=N-origin;
  $('#oorigin').textContent=dateOf(origin);
  $('#oelapsed').textContent=e===0?'起点の夜':e>0?`${e}夜目（${Math.floor(e/7)}巡りと${e%7}夜）`:`起点の${-e}夜前`;
  $('#o7').textContent=origin+7<=MAXN?dateOf(origin+7):'—';
  $('#o49').textContent=origin+49<=MAXN?dateOf(origin+49):'—';
}

/* 操作 */
(function init(){
  let o='';for(let m=1;m<=12;m++)o+=`<option value="${m}">${KAN1[m-1]}月 ${SEATS[m-1]}の月</option>`;
  o+='<option value="13">座渡し</option>';
  $('#fm').innerHTML=o;
  const groups=[['年',-1,1,k=>stepYear(k)],['月',-1,1,k=>stepMonth(k)],['七七夜',-49,49,k=>setN(N+k)],['一巡り',-7,7,k=>setN(N+k)],['一夜',-1,1,k=>setN(N+k)]];
  const st=$('#steps');
  groups.forEach(([nm,a,b,fn])=>{
    const l=document.createElement('span');l.className='nm';l.textContent=nm;
    const back=document.createElement('button');back.type='button';back.textContent='戻る';back.setAttribute('aria-label',`${nm}戻る`);
    const fwd=document.createElement('button');fwd.type='button';fwd.textContent='進む';fwd.setAttribute('aria-label',`${nm}進む`);
    back.onclick=()=>fn(a<0&&nm!=='年'&&nm!=='月'?a:-1);
    fwd.onclick=()=>fn(a<0&&nm!=='年'&&nm!=='月'?b:1);
    st.append(l,back,fwd);
  });
  $('#fy').onchange=e=>{const s=sel();const v=parseInt(e.target.value,10);if(!isNaN(v))setSel(v,s.m,s.d);else render()};
  $('#fm').onchange=e=>{const s=sel();setSel(s.Y,+e.target.value,s.d)};
  $('#fd').onchange=e=>{const s=sel();const v=parseInt(e.target.value,10);if(!isNaN(v))setSel(s.Y,s.m,v);else render()};
  $('#setorigin').onclick=()=>{origin=N;render()};
  $('#dialbox').addEventListener('keydown',e=>{
    const k={ArrowRight:1,ArrowLeft:-1,ArrowUp:7,ArrowDown:-7}[e.key];
    if(k){e.preventDefault();setN(N+k)}
  });
  render();
})();
})();
</script>
</body>
</html>
